extends: relaxed

rules:
  line-length: disable
  comments: disable
  document-start: disable
  truthy:
    # GitHub Actions uses "on:" as a key - not a yaml boolean check
    ignore:
      - "on"
      - ".github/workflows/*.yml"
  indentation:
    spaces: consistent
    indent-sequences: consistent

ignore: |
  grafana/dashboards/**
