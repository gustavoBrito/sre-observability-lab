name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install yamllint ruff

      - name: Lint YAML configs
        run: yamllint -c .yamllint.yml .

      - name: Lint Python services
        run: ruff check services/pricing-py

      - name: Validate docker compose schema
        run: docker compose config -q
